name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/PAX-Koksplanerare.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PAX-Koksplanerare-Release-APK
          path: output/PAX-Koksplanerare.apk
          if-no-files-found: error
