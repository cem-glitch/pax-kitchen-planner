name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Collect APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/PAX-Koksplanerare.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PAX-Koksplanerare-APK
          path: output/PAX-Koksplanerare.apk
          if-no-files-found: error
