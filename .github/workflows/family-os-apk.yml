      - name: Build Family OS visual APK
        working-directory: family-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp family-native/app/build/outputs/apk/debug/app-debug.apk output/FamilyOS-V3-Visual-Nav.apk
          sha256sum output/FamilyOS-V3-Visual-Nav.apk > output/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyOS-V3-Visual-Nav-APK
          path: |
            output/FamilyOS-V3-Visual-Nav.apk
            output/SHA256.txt
          if-no-files-found: error
          retention-days: 7
