          package se.vasterasindustri.viabservicebillager;

          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import com.journeyapps.barcodescanner.BarcodeCallback;
          import com.journeyapps.barcodescanner.BarcodeResult;
          import com.journeyapps.barcodescanner.DecoratedBarcodeView;
          import java.util.ArrayList;
          import org.json.JSONArray;

          public class ContinuousScanActivity extends AppCompatActivity {
            private DecoratedBarcodeView barcodeView;
            private TextView status;
            private final ArrayList<String> codes = new ArrayList<>();
            private String lastCode = "";
            private long lastAt = 0L;

            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setBackgroundColor(Color.BLACK);

              status = new TextView(this);
              status.setTextColor(Color.WHITE);
              status.setTextSize(16f);
              status.setGravity(Gravity.CENTER);
              status.setPadding(16,18,16,18);
              status.setText("Snabbskanning • 0 läsningar");

              barcodeView = new DecoratedBarcodeView(this);
              barcodeView.setStatusText("Skanna artiklar efter varandra. Varje godkänd läsning = +1.");
              barcodeView.decodeContinuous(new BarcodeCallback() {
                @Override public void barcodeResult(BarcodeResult result) {
                  if (result == null || result.getText() == null) return;
                  String code = result.getText().trim();
                  if (code.isEmpty()) return;
                  long now = System.currentTimeMillis();
                  if (code.equals(lastCode) && now-lastAt < 650L) return;
                  lastCode = code;
                  lastAt = now;
                  codes.add(code);
                  status.setText("Snabbskanning • " + codes.size() + " läsningar");
                  feedback();
                }
              });

              Button done = new Button(this);
              done.setText("Klar – visa korg");
              done.setTextSize(16f);
              done.setAllCaps(false);
              done.setOnClickListener(v -> finishWithResult());

              root.addView(status,new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT));
              root.addView(barcodeView,new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,0,1f));
              LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT);
              bp.setMargins(18,12,18,22);
              root.addView(done,bp);
              setContentView(root);
            }

            private void feedback() {
              try {
                ToneGenerator tone = new ToneGenerator(AudioManager.STREAM_ALARM, 100);
                tone.startTone(ToneGenerator.TONE_PROP_BEEP2, 120);
                status.postDelayed(tone::release, 180);
              } catch (Exception ignored) {}
              try {
                Vibrator v=(Vibrator)getSystemService(VIBRATOR_SERVICE);
                if(v!=null&&v.hasVibrator())v.vibrate(VibrationEffect.createOneShot(55,160));
              } catch (Exception ignored) {}
            }

            private void finishWithResult() {
              Intent data = new Intent();
              data.putExtra("codes", new JSONArray(codes).toString());
              setResult(RESULT_OK,data);
              finish();
            }

            @Override public void onBackPressed() {
              finishWithResult();
            }

            @Override protected void onResume() {
              super.onResume();
              barcodeView.resume();
            }

            @Override protected void onPause() {
              barcodeView.pause();
              super.onPause();
            }
          }
