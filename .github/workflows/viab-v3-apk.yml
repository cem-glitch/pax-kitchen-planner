name: Build VIAB Servicebil Lager V3 APK

on:
  push:
    branches:
      - viab-apk-build
    paths:
      - ".github/workflows/viab-v3-apk.yml"
      - "viab-servicebil-lager-v3/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: |
          set -e
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmdline-tools.zip
          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Create project
        run: |
          ROOT="viab-v3-android"
          mkdir -p "$ROOT/app/src/main/java/se/vasterasindustri/viabservicebillager"
          mkdir -p "$ROOT/app/src/main/assets" "$ROOT/app/src/main/res/drawable" "$ROOT/app/src/main/res/values" "$ROOT/app/src/main/res/raw"
          cat > "$ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "VIABServicebilLager"
          include(":app")
          EOF
          cat > "$ROOT/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") version "8.7.3" apply false }
          EOF
          cat > "$ROOT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cat > "$ROOT/app/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") }
          android {
            namespace = "se.vasterasindustri.viabservicebillager"
            compileSdk = 35
            defaultConfig {
              applicationId = "se.vasterasindustri.viabservicebillager"
              minSdk = 26
              targetSdk = 35
              versionCode = 9
              versionName = "4.3"
            }
            buildTypes { release { isMinifyEnabled = false } }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
          }
          configurations.all {
            resolutionStrategy.eachDependency {
              if (requested.group == "org.jetbrains.kotlin") useVersion("1.8.22")
            }
          }
          dependencies {
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("androidx.webkit:webkit:1.12.1")
            implementation("com.journeyapps:zxing-android-embedded:4.3.0")
            implementation("com.google.mlkit:text-recognition:16.0.1")
            implementation("com.google.mlkit:barcode-scanning:17.3.0")
          }
          EOF
          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <uses-feature android:name="android.hardware.camera.any" android:required="false"/>
            <application
              android:allowBackup="true"
              android:hardwareAccelerated="true"
              android:icon="@drawable/ic_launcher"
              android:roundIcon="@drawable/ic_launcher"
              android:label="VIAB Servicebil Lager"
              android:supportsRtl="true"
              android:theme="@style/AppTheme">
              <activity
                android:name=".PortraitCaptureActivity"
                android:screenOrientation="portrait"
                android:configChanges="orientation|screenSize"
                android:exported="false"/>
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#0B0B0B</item>
              <item name="android:navigationBarColor">#0B0B0B</item>
            </style>
          </resources>
          EOF
          cat > "$ROOT/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0B0B0B" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#19A457" android:pathData="M17,24h17l20,47 20,-47h17L62,88H46z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M69,61h21v17H69z"/>
            <path android:fillColor="#0B0B0B" android:pathData="M73,65h13v9H73z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M70,29h3v22h-3zM76,29h2v22h-2zM82,29h4v22h-4zM90,29h2v22h-2z"/>
          </vector>
          EOF
          python3 - <<'PY'
          import wave, math, struct
          path="viab-v3-android/app/src/main/res/raw/scan_beep.wav"
          rate=44100
          duration=0.16
          freq=1180.0
          frames=int(rate*duration)
          with wave.open(path,"w") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              for i in range(frames):
                  env=min(1.0,i/(rate*0.01))*min(1.0,(frames-i)/(rate*0.035))
                  sample=int(0.62*32767*env*math.sin(2*math.pi*freq*i/rate))
                  w.writeframesraw(struct.pack("<h",sample))
          PY
          cat > "$ROOT/app/src/main/java/se/vasterasindustri/viabservicebillager/MainActivity.java" <<'EOF'
          package se.vasterasindustri.viabservicebillager;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.net.Uri;
          import android.location.LocationManager;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.ToneGenerator;
          import android.graphics.Bitmap;
          import android.provider.MediaStore;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          import com.google.zxing.integration.android.IntentIntegrator;
          import com.google.zxing.integration.android.IntentResult;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          import com.google.mlkit.vision.barcode.BarcodeScanning;
          import com.google.mlkit.vision.barcode.common.Barcode;
          import java.util.List;
          import org.json.JSONObject;
          public class MainActivity extends AppCompatActivity {
            private static final int REQ_LABEL_PHOTO = 77;
            private WebView webView;
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED
                  || ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                ActivityCompat.requestPermissions(this, new String[]{
                  Manifest.permission.CAMERA,
                  Manifest.permission.ACCESS_FINE_LOCATION,
                  Manifest.permission.ACCESS_COARSE_LOCATION
                }, 41);
              }
              webView = new WebView(this);
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
              webView.setWebViewClient(new WebViewClientCompat() {
                @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) {
                  return loader.shouldInterceptRequest(request.getUrl());
                }
              });
              webView.addJavascriptInterface(new Bridge(), "Android");
              webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }
            public class Bridge {
              @JavascriptInterface public void scanBarcode() {
                runOnUiThread(() -> {
                  IntentIntegrator i = new IntentIntegrator(MainActivity.this);
                  i.setPrompt("Skanna streckkod");
                  i.setBeepEnabled(false);
                  i.setCaptureActivity(PortraitCaptureActivity.class);
                  i.setOrientationLocked(true);
                  i.setDesiredBarcodeFormats(IntentIntegrator.ALL_CODE_TYPES);
                  i.initiateScan();
                });
              }

              @JavascriptInterface public void scanArticleLabel() {
                runOnUiThread(() -> {
                  try {
                    Intent takePicture = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                    if (takePicture.resolveActivity(getPackageManager()) != null) {
                      startActivityForResult(takePicture, REQ_LABEL_PHOTO);
                    } else {
                      emitArticleLabelError("Ingen kamera hittades.");
                    }
                  } catch (Exception e) {
                    emitArticleLabelError("Kameran kunde inte öppnas.");
                  }
                });
              }

              @JavascriptInterface public void playScanFeedback() {
                runOnUiThread(() -> playScanFeedbackNow());
              }

              @JavascriptInterface public void openMap(double lat, double lon) {
                runOnUiThread(() -> {
                  try {
                    Uri geo = Uri.parse("geo:" + lat + "," + lon + "?q=" + lat + "," + lon);
                    Intent mapIntent = new Intent(Intent.ACTION_VIEW, geo);
                    startActivity(mapIntent);
                  } catch (Exception e) {
                    try {
                      Uri web = Uri.parse("https://maps.google.com/?q=" + lat + "," + lon);
                      startActivity(new Intent(Intent.ACTION_VIEW, web));
                    } catch (Exception ignored) {}
                  }
                });
              }

              @JavascriptInterface public void getLocation() {
                runOnUiThread(() -> {
                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED
                      && ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(MainActivity.this, new String[]{
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                    }, 42);
                    emitLocationError("Platsbehörighet saknas. Tillåt plats och försök igen.");
                    return;
                  }

                  try {
                    LocationManager lm = (LocationManager)getSystemService(LOCATION_SERVICE);
                    Location best = null;
                    for (String provider : lm.getProviders(true)) {
                      try {
                        Location last = lm.getLastKnownLocation(provider);
                        if (last != null && (best == null || last.getAccuracy() < best.getAccuracy())) best = last;
                      } catch (Exception ignored) {}
                    }
                    if (best != null) {
                      emitLocation(best);
                      return;
                    }

                    String provider = lm.getBestProvider(new android.location.Criteria(), true);
                    if (provider == null) {
                      emitLocationError("Plats kunde inte hämtas. Kontrollera GPS.");
                      return;
                    }

                    LocationListener listener = new LocationListener() {
                      @Override public void onLocationChanged(Location location) {
                        emitLocation(location);
                        try { lm.removeUpdates(this); } catch (Exception ignored) {}
                      }
                      @Override public void onProviderEnabled(String provider) {}
                      @Override public void onProviderDisabled(String provider) {}
                      @Override public void onStatusChanged(String provider, int status, Bundle extras) {}
                    };
                    lm.requestSingleUpdate(provider, listener, Looper.getMainLooper());
                    new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      try { lm.removeUpdates(listener); } catch (Exception ignored) {}
                    }, 7000);
                  } catch (Exception e) {
                    emitLocationError("Plats kunde inte hämtas.");
                  }
                });
              }
            }

            private void emitLocation(Location location) {
              if (location == null || webView == null) {
                emitLocationError("Plats kunde inte hämtas.");
                return;
              }
              String js = "window.onNativeLocation(" + location.getLatitude() + "," + location.getLongitude() + "," + location.getAccuracy() + ")";
              webView.evaluateJavascript(js, null);
            }

            private void emitLocationError(String message) {
              if (webView != null) {
                webView.evaluateJavascript("window.onNativeLocationError(" + JSONObject.quote(message) + ")", null);
              }
            }

            private void emitArticleLabel(String rawText, String barcode) {
              if (webView == null) return;
              String js = "window.onNativeArticleLabel(" +
                JSONObject.quote(rawText == null ? "" : rawText) + "," +
                JSONObject.quote(barcode == null ? "" : barcode) + ")";
              webView.evaluateJavascript(js, null);
            }

            private void emitArticleLabelError(String message) {
              if (webView != null) {
                webView.evaluateJavascript(
                  "window.onNativeArticleLabelError(" + JSONObject.quote(message) + ")", null
                );
              }
            }

            private void processArticleLabelImage(Bitmap bitmap) {
              if (bitmap == null) {
                emitArticleLabelError("Ingen bild togs.");
                return;
              }

              InputImage image = InputImage.fromBitmap(bitmap, 0);
              TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                .process(image)
                .addOnSuccessListener(text -> {
                  final String rawText = text.getText() == null ? "" : text.getText();
                  BarcodeScanning.getClient()
                    .process(image)
                    .addOnSuccessListener(barcodes -> {
                      String rawBarcode = "";
                      if (barcodes != null) {
                        for (Barcode b : barcodes) {
                          if (b != null && b.getRawValue() != null && !b.getRawValue().trim().isEmpty()) {
                            rawBarcode = b.getRawValue().trim();
                            break;
                          }
                        }
                      }
                      emitArticleLabel(rawText, rawBarcode);
                    })
                    .addOnFailureListener(e -> emitArticleLabel(rawText, ""));
                })
                .addOnFailureListener(e ->
                  emitArticleLabelError("Etiketttexten kunde inte läsas. Ta bilden närmare och försök igen.")
                );
            }

            private void playScanFeedbackNow() {
              boolean started = false;
              try {
                MediaPlayer mp = MediaPlayer.create(this, R.raw.scan_beep);
                if (mp != null) {
                  mp.setVolume(1.0f, 1.0f);
                  mp.setOnCompletionListener(p -> { try { p.release(); } catch (Exception ignored) {} });
                  mp.start();
                  started = true;
                }
              } catch (Exception ignored) {}

              if (!started) {
                try {
                  ToneGenerator tone = new ToneGenerator(AudioManager.STREAM_ALARM, 100);
                  tone.startTone(ToneGenerator.TONE_PROP_BEEP2, 180);
                  new Handler(Looper.getMainLooper()).postDelayed(tone::release, 260);
                } catch (Exception ignored) {}
              }

              try {
                Vibrator v = (Vibrator)getSystemService(VIBRATOR_SERVICE);
                if (v != null && v.hasVibrator()) {
                  v.vibrate(VibrationEffect.createOneShot(75, 180));
                }
              } catch (Exception ignored) {}
            }

            @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              if (requestCode == REQ_LABEL_PHOTO) {
                if (resultCode == RESULT_OK && data != null && data.getExtras() != null) {
                  Object obj = data.getExtras().get("data");
                  if (obj instanceof Bitmap) {
                    processArticleLabelImage((Bitmap)obj);
                  } else {
                    emitArticleLabelError("Bilden kunde inte läsas.");
                  }
                } else if (resultCode != RESULT_CANCELED) {
                  emitArticleLabelError("Etiketten kunde inte fotograferas.");
                }
                return;
              }

              IntentResult result = IntentIntegrator.parseActivityResult(requestCode, resultCode, data);
              if (result != null) {
                if (result.getContents() != null && webView != null) {
                  webView.evaluateJavascript("window.onNativeBarcode(" + JSONObject.quote(result.getContents()) + ")", null);
                }
                return;
              }
              super.onActivityResult(requestCode, resultCode, data);
            }
          }
          EOF
          cat > "$ROOT/app/src/main/java/se/vasterasindustri/viabservicebillager/PortraitCaptureActivity.java" <<'EOF'
          package se.vasterasindustri.viabservicebillager;

          import android.content.pm.ActivityInfo;
          import android.os.Bundle;
          import com.journeyapps.barcodescanner.CaptureActivity;

          public class PortraitCaptureActivity extends CaptureActivity {
            @Override protected void onCreate(Bundle savedInstanceState) {
              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          cp viab-servicebil-lager-v3/index.html "$ROOT/app/src/main/assets/index.html"
      - name: Build APK
        working-directory: viab-v3-android
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p ../viab-v3-output
          cp app/build/outputs/apk/debug/app-debug.apk ../viab-v3-output/VIAB-Servicebil-Lager-v3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIAB-Servicebil-Lager-v3
          path: viab-v3-output/VIAB-Servicebil-Lager-v3.apk
          if-no-files-found: error
