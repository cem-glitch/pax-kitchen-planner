name: Build VIAB Servicebil Lager V3 APK

on:
  push:
    branches:
      - viab-apk-build
    paths:
      - ".github/workflows/viab-v3-apk.yml"
      - "viab-servicebil-lager-v3/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: |
          set -e
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmdline-tools.zip
          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Create project
        run: |
          ROOT="viab-v3-android"
          mkdir -p "$ROOT/app/src/main/java/se/vasterasindustri/viabservicebillager"
          mkdir -p "$ROOT/app/src/main/assets" "$ROOT/app/src/main/res/drawable" "$ROOT/app/src/main/res/values" "$ROOT/app/src/main/res/raw"
          cat > "$ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "VIABServicebilLager"
          include(":app")
          EOF
          cat > "$ROOT/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") version "8.7.3" apply false }
          EOF
          cat > "$ROOT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cat > "$ROOT/app/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") }
          android {
            namespace = "se.vasterasindustri.viabservicebillager"
            compileSdk = 35
            defaultConfig {
              applicationId = "se.vasterasindustri.viabservicebillager"
              minSdk = 26
              targetSdk = 35
              versionCode = 10
              versionName = "5.0"
            }
            buildTypes { release { isMinifyEnabled = false } }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
          }
          configurations.all {
            resolutionStrategy.eachDependency {
              if (requested.group == "org.jetbrains.kotlin") useVersion("1.8.22")
            }
          }
          dependencies {
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("androidx.webkit:webkit:1.12.1")
            implementation("com.journeyapps:zxing-android-embedded:4.3.0")
            implementation("com.google.mlkit:text-recognition:16.0.1")
            implementation("com.google.mlkit:barcode-scanning:17.3.0")
            implementation("androidx.biometric:biometric:1.1.0")
          }
          EOF
          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <uses-feature android:name="android.hardware.camera.any" android:required="false"/>
            <application
              android:allowBackup="true"
              android:hardwareAccelerated="true"
              android:icon="@drawable/ic_launcher"
              android:roundIcon="@drawable/ic_launcher"
              android:label="VIAB Servicebil Lager"
              android:supportsRtl="true"
              android:theme="@style/AppTheme">
              <activity
                android:name=".PortraitCaptureActivity"
                android:screenOrientation="portrait"
                android:configChanges="orientation|screenSize"
                android:exported="false"/>
              <activity
                android:name=".ContinuousScanActivity"
                android:screenOrientation="portrait"
                android:configChanges="orientation|screenSize"
                android:exported="false"/>
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#0B0B0B</item>
              <item name="android:navigationBarColor">#0B0B0B</item>
            </style>
          </resources>
          EOF
          cat > "$ROOT/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0B0B0B" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#19A457" android:pathData="M17,24h17l20,47 20,-47h17L62,88H46z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M69,61h21v17H69z"/>
            <path android:fillColor="#0B0B0B" android:pathData="M73,65h13v9H73z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M70,29h3v22h-3zM76,29h2v22h-2zM82,29h4v22h-4zM90,29h2v22h-2z"/>
          </vector>
          EOF
          python3 - <<'PY'
          import wave, math, struct
          path="viab-v3-android/app/src/main/res/raw/scan_beep.wav"
          rate=44100
          duration=0.16
          freq=1180.0
          frames=int(rate*duration)
          with wave.open(path,"w") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              for i in range(frames):
                  env=min(1.0,i/(rate*0.01))*min(1.0,(frames-i)/(rate*0.035))
                  sample=int(0.62*32767*env*math.sin(2*math.pi*freq*i/rate))
                  w.writeframesraw(struct.pack("<h",sample))
          PY
          cat > "$ROOT/app/src/main/java/se/vasterasindustri/viabservicebillager/MainActivity.java" <<'EOF'
          package se.vasterasindustri.viabservicebillager;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.net.Uri;
          import android.location.LocationManager;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.ToneGenerator;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.provider.MediaStore;
          import android.os.Bundle;
          import android.content.SharedPreferences;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.text.TextUtils;
          import android.util.Base64;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          import com.google.zxing.integration.android.IntentIntegrator;
          import com.google.zxing.integration.android.IntentResult;
          import com.google.zxing.BarcodeFormat;
          import com.google.zxing.MultiFormatWriter;
          import com.google.zxing.common.BitMatrix;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          import com.google.mlkit.vision.barcode.BarcodeScanning;
          import com.google.mlkit.vision.barcode.common.Barcode;
          import java.util.List;
          import java.util.concurrent.Executor;
          import java.io.ByteArrayOutputStream;
          import java.io.OutputStream;
          import org.json.JSONObject;
          public class MainActivity extends AppCompatActivity {
            private static final int REQ_LABEL_PHOTO = 77;
            private static final int REQ_PRODUCT_PHOTO = 78;
            private static final int REQ_CONTINUOUS_SCAN = 79;
            private static final int REQ_SAVE_FILE = 80;
            private WebView webView;
            private WebView printWebView;
            private String pendingSaveContent;
            private String pendingSaveMime;
            private long lastPausedAt = 0L;
            private boolean authenticating = false;
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED
                  || ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                ActivityCompat.requestPermissions(this, new String[]{
                  Manifest.permission.CAMERA,
                  Manifest.permission.ACCESS_FINE_LOCATION,
                  Manifest.permission.ACCESS_COARSE_LOCATION
                }, 41);
              }
              webView = new WebView(this);
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
              webView.setWebViewClient(new WebViewClientCompat() {
                @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) {
                  return loader.shouldInterceptRequest(request.getUrl());
                }
              });
              webView.addJavascriptInterface(new Bridge(), "Android");
              webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }
            @Override protected void onPause() {
              super.onPause();
              if (!authenticating) lastPausedAt = System.currentTimeMillis();
            }

            @Override protected void onResume() {
              super.onResume();
              if (getSharedPreferences("viab_security", MODE_PRIVATE).getBoolean("app_lock", false)
                  && lastPausedAt > 0
                  && System.currentTimeMillis() - lastPausedAt > 60000L) {
                new Handler(Looper.getMainLooper()).postDelayed(() -> promptAppLock(true, false), 250);
              }
            }

            public class Bridge {
              @JavascriptInterface public void scanBarcode() {
                runOnUiThread(() -> {
                  IntentIntegrator i = new IntentIntegrator(MainActivity.this);
                  i.setPrompt("Skanna streckkod");
                  i.setBeepEnabled(false);
                  i.setCaptureActivity(PortraitCaptureActivity.class);
                  i.setOrientationLocked(true);
                  i.setDesiredBarcodeFormats(IntentIntegrator.ALL_CODE_TYPES);
                  i.initiateScan();
                });
              }

              @JavascriptInterface public void startContinuousScan() {
                runOnUiThread(() -> {
                  try {
                    startActivityForResult(new Intent(MainActivity.this, ContinuousScanActivity.class), REQ_CONTINUOUS_SCAN);
                  } catch (Exception e) {
                    if (webView != null) webView.evaluateJavascript("alert('Snabbskannern kunde inte öppnas.')", null);
                  }
                });
              }

              @JavascriptInterface public void captureArticlePhoto() {
                runOnUiThread(() -> {
                  try {
                    Intent takePicture = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                    if (takePicture.resolveActivity(getPackageManager()) != null) {
                      startActivityForResult(takePicture, REQ_PRODUCT_PHOTO);
                    } else {
                      emitArticlePhotoError("Ingen kamera hittades.");
                    }
                  } catch (Exception e) {
                    emitArticlePhotoError("Kameran kunde inte öppnas.");
                  }
                });
              }

              @JavascriptInterface public boolean isAppLockEnabled() {
                return getSharedPreferences("viab_security", MODE_PRIVATE).getBoolean("app_lock", false);
              }

              @JavascriptInterface public void setAppLock(boolean enabled) {
                runOnUiThread(() -> {
                  if (!enabled) {
                    getSharedPreferences("viab_security", MODE_PRIVATE).edit().putBoolean("app_lock", false).apply();
                    emitAppLockChanged(false);
                  } else {
                    promptAppLock(false, true);
                  }
                });
              }

              @JavascriptInterface public void saveTextFile(String filename, String mimeType, String content) {
                runOnUiThread(() -> {
                  try {
                    pendingSaveContent = content == null ? "" : content;
                    pendingSaveMime = (mimeType == null || mimeType.isEmpty()) ? "text/plain" : mimeType;
                    Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                    intent.addCategory(Intent.CATEGORY_OPENABLE);
                    intent.setType(pendingSaveMime);
                    intent.putExtra(Intent.EXTRA_TITLE, filename == null ? "VIAB-export.txt" : filename);
                    startActivityForResult(intent, REQ_SAVE_FILE);
                  } catch (Exception e) {
                    if (webView != null) webView.evaluateJavascript("alert('Filen kunde inte sparas.')", null);
                  }
                });
              }

              @JavascriptInterface public void printArticleLabel(String articleNo, String articleName, String barcode, int packageQty) {
                runOnUiThread(() -> printLabel(articleNo, articleName, barcode, packageQty));
              }

              @JavascriptInterface public void scanArticleLabel() {
                runOnUiThread(() -> {
                  try {
                    Intent takePicture = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                    if (takePicture.resolveActivity(getPackageManager()) != null) {
                      startActivityForResult(takePicture, REQ_LABEL_PHOTO);
                    } else {
                      emitArticleLabelError("Ingen kamera hittades.");
                    }
                  } catch (Exception e) {
                    emitArticleLabelError("Kameran kunde inte öppnas.");
                  }
                });
              }

              @JavascriptInterface public void playScanFeedback() {
                runOnUiThread(() -> playScanFeedbackNow());
              }

              @JavascriptInterface public void openMap(double lat, double lon) {
                runOnUiThread(() -> {
                  try {
                    Uri geo = Uri.parse("geo:" + lat + "," + lon + "?q=" + lat + "," + lon);
                    Intent mapIntent = new Intent(Intent.ACTION_VIEW, geo);
                    startActivity(mapIntent);
                  } catch (Exception e) {
                    try {
                      Uri web = Uri.parse("https://maps.google.com/?q=" + lat + "," + lon);
                      startActivity(new Intent(Intent.ACTION_VIEW, web));
                    } catch (Exception ignored) {}
                  }
                });
              }

              @JavascriptInterface public void getLocation() {
                runOnUiThread(() -> {
                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED
                      && ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(MainActivity.this, new String[]{
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                    }, 42);
                    emitLocationError("Platsbehörighet saknas. Tillåt plats och försök igen.");
                    return;
                  }

                  try {
                    LocationManager lm = (LocationManager)getSystemService(LOCATION_SERVICE);
                    Location best = null;
                    for (String provider : lm.getProviders(true)) {
                      try {
                        Location last = lm.getLastKnownLocation(provider);
                        if (last != null && (best == null || last.getAccuracy() < best.getAccuracy())) best = last;
                      } catch (Exception ignored) {}
                    }
                    if (best != null) {
                      emitLocation(best);
                      return;
                    }

                    String provider = lm.getBestProvider(new android.location.Criteria(), true);
                    if (provider == null) {
                      emitLocationError("Plats kunde inte hämtas. Kontrollera GPS.");
                      return;
                    }

                    LocationListener listener = new LocationListener() {
                      @Override public void onLocationChanged(Location location) {
                        emitLocation(location);
                        try { lm.removeUpdates(this); } catch (Exception ignored) {}
                      }
                      @Override public void onProviderEnabled(String provider) {}
                      @Override public void onProviderDisabled(String provider) {}
                      @Override public void onStatusChanged(String provider, int status, Bundle extras) {}
                    };
                    lm.requestSingleUpdate(provider, listener, Looper.getMainLooper());
                    new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      try { lm.removeUpdates(listener); } catch (Exception ignored) {}
                    }, 7000);
                  } catch (Exception e) {
                    emitLocationError("Plats kunde inte hämtas.");
                  }
                });
              }
            }

            private void emitLocation(Location location) {
              if (location == null || webView == null) {
                emitLocationError("Plats kunde inte hämtas.");
                return;
              }
              String js = "window.onNativeLocation(" + location.getLatitude() + "," + location.getLongitude() + "," + location.getAccuracy() + ")";
              webView.evaluateJavascript(js, null);
            }

            private void emitLocationError(String message) {
              if (webView != null) {
                webView.evaluateJavascript("window.onNativeLocationError(" + JSONObject.quote(message) + ")", null);
              }
            }

            private void emitArticleLabel(String rawText, String barcode) {
              if (webView == null) return;
              String js = "window.onNativeArticleLabel(" +
                JSONObject.quote(rawText == null ? "" : rawText) + "," +
                JSONObject.quote(barcode == null ? "" : barcode) + ")";
              webView.evaluateJavascript(js, null);
            }

            private void emitArticleLabelError(String message) {
              if (webView != null) {
                webView.evaluateJavascript(
                  "window.onNativeArticleLabelError(" + JSONObject.quote(message) + ")", null
                );
              }
            }

            private void processArticleLabelImage(Bitmap bitmap) {
              if (bitmap == null) {
                emitArticleLabelError("Ingen bild togs.");
                return;
              }

              InputImage image = InputImage.fromBitmap(bitmap, 0);
              TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                .process(image)
                .addOnSuccessListener(text -> {
                  final String rawText = text.getText() == null ? "" : text.getText();
                  BarcodeScanning.getClient()
                    .process(image)
                    .addOnSuccessListener(barcodes -> {
                      String rawBarcode = "";
                      if (barcodes != null) {
                        for (Barcode b : barcodes) {
                          if (b != null && b.getRawValue() != null && !b.getRawValue().trim().isEmpty()) {
                            rawBarcode = b.getRawValue().trim();
                            break;
                          }
                        }
                      }
                      emitArticleLabel(rawText, rawBarcode);
                    })
                    .addOnFailureListener(e -> emitArticleLabel(rawText, ""));
                })
                .addOnFailureListener(e ->
                  emitArticleLabelError("Etiketttexten kunde inte läsas. Ta bilden närmare och försök igen.")
                );
            }

            private void emitArticlePhoto(String base64) {
              if (webView != null) {
                webView.evaluateJavascript("window.onNativeArticlePhoto(" + JSONObject.quote(base64) + ")", null);
              }
            }

            private void emitArticlePhotoError(String message) {
              if (webView != null) {
                webView.evaluateJavascript("window.onNativeArticlePhotoError(" + JSONObject.quote(message) + ")", null);
              }
            }

            private void emitAppLockChanged(boolean enabled) {
              if (webView != null) {
                webView.evaluateJavascript("if(window.onNativeAppLockChanged)window.onNativeAppLockChanged(" + enabled + ")", null);
              }
            }

            private void promptAppLock(boolean enforce, boolean enableOnSuccess) {
              if (authenticating) return;
              final int auths = BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.DEVICE_CREDENTIAL;
              BiometricManager bm = BiometricManager.from(this);
              if (bm.canAuthenticate(auths) != BiometricManager.BIOMETRIC_SUCCESS) {
                if (enableOnSuccess) emitAppLockChanged(false);
                if (enforce) finishAffinity();
                return;
              }

              authenticating = true;
              Executor executor = ContextCompat.getMainExecutor(this);
              BiometricPrompt prompt = new BiometricPrompt(this, executor, new BiometricPrompt.AuthenticationCallback() {
                @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                  super.onAuthenticationSucceeded(result);
                  authenticating = false;
                  if (enableOnSuccess) {
                    getSharedPreferences("viab_security", MODE_PRIVATE).edit().putBoolean("app_lock", true).apply();
                    emitAppLockChanged(true);
                  }
                }
                @Override public void onAuthenticationError(int errorCode, CharSequence errString) {
                  super.onAuthenticationError(errorCode, errString);
                  authenticating = false;
                  if (enableOnSuccess) emitAppLockChanged(false);
                  if (enforce) finishAffinity();
                }
              });

              BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                .setTitle("VIAB Servicebil Lager")
                .setSubtitle("Verifiera med biometri eller telefonens skärmlås")
                .setAllowedAuthenticators(auths)
                .build();
              prompt.authenticate(info);
            }

            private void printLabel(String articleNo, String articleName, String barcode, int packageQty) {
              try {
                String code = (barcode == null || barcode.trim().isEmpty()) ? articleNo : barcode.trim();
                BitMatrix matrix = new MultiFormatWriter().encode(code, BarcodeFormat.CODE_128, 900, 220);
                Bitmap bmp = Bitmap.createBitmap(matrix.getWidth(), matrix.getHeight(), Bitmap.Config.ARGB_8888);
                for (int y=0; y<matrix.getHeight(); y++) {
                  for (int x=0; x<matrix.getWidth(); x++) bmp.setPixel(x,y,matrix.get(x,y)?Color.BLACK:Color.WHITE);
                }
                ByteArrayOutputStream baos = new ByteArrayOutputStream();
                bmp.compress(Bitmap.CompressFormat.PNG, 100, baos);
                String image64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                String safeNo = TextUtils.htmlEncode(articleNo == null ? "" : articleNo);
                String safeName = TextUtils.htmlEncode(articleName == null ? "" : articleName);
                String html = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'>"
                  + "<style>@page{size:62mm 40mm;margin:0}body{margin:0;font-family:sans-serif;color:#111}"
                  + ".l{width:62mm;height:40mm;box-sizing:border-box;padding:4mm;display:flex;flex-direction:column;justify-content:center;text-align:center}"
                  + "h1{font-size:15pt;margin:0 0 1.5mm;font-weight:900}h2{font-size:10pt;margin:0 0 1mm}.b{width:100%;height:11mm;object-fit:fill}.c{font-size:9pt;font-weight:900;margin-top:1mm}.p{font-size:8pt;margin-top:.5mm}</style></head>"
                  + "<body><div class='l'><h2>VIAB • ALFA ROBOT</h2><h1>"+safeName+"</h1><img class='b' src='data:image/png;base64,"+image64+"'>"
                  + "<div class='c'>"+safeNo+"</div><div class='p'>Förpackning: "+Math.max(1,packageQty)+" st</div></div></body></html>";

                printWebView = new WebView(this);
                printWebView.getSettings().setJavaScriptEnabled(false);
                printWebView.setWebViewClient(new WebViewClient() {
                  @Override public void onPageFinished(WebView view, String url) {
                    PrintManager pm = (PrintManager)getSystemService(PRINT_SERVICE);
                    PrintAttributes.MediaSize labelSize = new PrintAttributes.MediaSize("VIAB_62X40","VIAB 62x40 mm",2441,1575);
                    PrintAttributes attrs = new PrintAttributes.Builder()
                      .setMediaSize(labelSize)
                      .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                      .setColorMode(PrintAttributes.COLOR_MODE_MONOCHROME)
                      .build();
                    pm.print("VIAB-"+safeNo, printWebView.createPrintDocumentAdapter("VIAB-"+safeNo), attrs);
                  }
                });
                printWebView.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
              } catch (Exception e) {
                if (webView != null) webView.evaluateJavascript("alert('Etiketten kunde inte skapas.')", null);
              }
            }

            private void playScanFeedbackNow() {
              boolean started = false;
              try {
                MediaPlayer mp = MediaPlayer.create(this, R.raw.scan_beep);
                if (mp != null) {
                  mp.setVolume(1.0f, 1.0f);
                  mp.setOnCompletionListener(p -> { try { p.release(); } catch (Exception ignored) {} });
                  mp.start();
                  started = true;
                }
              } catch (Exception ignored) {}

              if (!started) {
                try {
                  ToneGenerator tone = new ToneGenerator(AudioManager.STREAM_ALARM, 100);
                  tone.startTone(ToneGenerator.TONE_PROP_BEEP2, 180);
                  new Handler(Looper.getMainLooper()).postDelayed(tone::release, 260);
                } catch (Exception ignored) {}
              }

              try {
                Vibrator v = (Vibrator)getSystemService(VIBRATOR_SERVICE);
                if (v != null && v.hasVibrator()) {
                  v.vibrate(VibrationEffect.createOneShot(75, 180));
                }
              } catch (Exception ignored) {}
            }

            @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              if (requestCode == REQ_LABEL_PHOTO) {
                if (resultCode == RESULT_OK && data != null && data.getExtras() != null) {
                  Object obj = data.getExtras().get("data");
                  if (obj instanceof Bitmap) processArticleLabelImage((Bitmap)obj);
                  else emitArticleLabelError("Bilden kunde inte läsas.");
                } else if (resultCode != RESULT_CANCELED) {
                  emitArticleLabelError("Etiketten kunde inte fotograferas.");
                }
                return;
              }

              if (requestCode == REQ_PRODUCT_PHOTO) {
                if (resultCode == RESULT_OK && data != null && data.getExtras() != null) {
                  Object obj = data.getExtras().get("data");
                  if (obj instanceof Bitmap) {
                    Bitmap bm = (Bitmap)obj;
                    int w=bm.getWidth(), h=bm.getHeight();
                    if (Math.max(w,h)>1280) {
                      float scale=1280f/Math.max(w,h);
                      bm=Bitmap.createScaledBitmap(bm,Math.max(1,(int)(w*scale)),Math.max(1,(int)(h*scale)),true);
                    }
                    ByteArrayOutputStream out = new ByteArrayOutputStream();
                    bm.compress(Bitmap.CompressFormat.JPEG, 86, out);
                    emitArticlePhoto(Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP));
                  } else emitArticlePhotoError("Produktbilden kunde inte läsas.");
                }
                return;
              }

              if (requestCode == REQ_CONTINUOUS_SCAN) {
                if (resultCode == RESULT_OK && data != null && webView != null) {
                  String codes = data.getStringExtra("codes");
                  if (codes == null) codes = "[]";
                  webView.evaluateJavascript("window.onNativeFastScan(" + JSONObject.quote(codes) + ")", null);
                }
                return;
              }

              if (requestCode == REQ_SAVE_FILE) {
                if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                  try (OutputStream out = getContentResolver().openOutputStream(data.getData())) {
                    if (out != null) out.write((pendingSaveContent == null ? "" : pendingSaveContent).getBytes(java.nio.charset.StandardCharsets.UTF_8));
                    if (webView != null) webView.evaluateJavascript("alert('Filen är sparad.')", null);
                  } catch (Exception e) {
                    if (webView != null) webView.evaluateJavascript("alert('Filen kunde inte sparas.')", null);
                  }
                }
                pendingSaveContent = null;
                pendingSaveMime = null;
                return;
              }

              IntentResult result = IntentIntegrator.parseActivityResult(requestCode, resultCode, data);
              if (result != null) {
                if (result.getContents() != null && webView != null) {
                  webView.evaluateJavascript("window.onNativeBarcode(" + JSONObject.quote(result.getContents()) + ")", null);
                }
                return;
              }
              super.onActivityResult(requestCode, resultCode, data);
            }
          }
