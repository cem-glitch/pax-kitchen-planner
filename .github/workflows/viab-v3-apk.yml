      - name: Build APK
        working-directory: viab-v3-android
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleRelease
          mkdir -p ../viab-v3-output
          cp app/build/outputs/apk/debug/app-debug.apk ../viab-v3-output/VIAB-Servicebil-Lager-V5.0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../viab-v3-output/VIAB-Servicebil-Lager-V5.0-unsigned.apk
          APKSIGNER_BIN="$(find "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          APKSIGNER_JAR="$(find "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' 2>/dev/null | sort -V | tail -1)"
          if [ -n "$APKSIGNER_JAR" ]; then
            cp "$APKSIGNER_JAR" ../viab-v3-output/apksigner.jar
          elif [ -n "$APKSIGNER_BIN" ]; then
            cp "$APKSIGNER_BIN" ../viab-v3-output/apksigner
            chmod +x ../viab-v3-output/apksigner
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIAB-Servicebil-Lager-v3
          path: viab-v3-output/*
          if-no-files-found: error
